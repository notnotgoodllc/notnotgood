<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khảo sát độc giả manga tiếng Việt</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #1f2733;
    --muted: #667085;
    --line: #e5e0d8;
    --brand: #c0392b;
    --brand-dark: #96271a;
    --accent: #f4ede1;
    --ok: #2e7d54;
    --radius: 14px;
    --shadow: 0 6px 24px rgba(31, 39, 51, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 18px 64px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin-bottom: 18px; }
  header .eyebrow {
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 700;
  }
  header h1 { font-size: 20px; margin: 6px 0 0; }

  .progress {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 22px;
  }
  .progress > span {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--brand);
    transition: width .35s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px;
  }

  .intro p { color: var(--muted); }
  .intro .lead { color: var(--ink); font-size: 16px; }

  .qtag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--brand);
    background: var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 12px;
  }
  .qtext { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
  .qhint { font-size: 13px; color: var(--muted); margin: 0 0 18px; }

  .pitch-title { font-size: 22px; font-weight: 750; line-height: 1.3; margin: 4px 0 12px; }
  .pitch-body { font-size: 16px; color: var(--ink); margin: 0 0 18px; }
  .pitch-label { display: block; font-size: 14px; font-weight: 650; margin-bottom: 2px; }

  /* Combined form page */
  .form-lead { font-size: 16px; font-weight: 650; margin: 0 0 4px; }
  .form-section { padding: 22px 0; border-top: 1px solid var(--line); }
  .form-section:first-of-type { border-top: none; padding-top: 8px; }
  .form-section .qtext { font-size: 17px; }
  .pitch-section { background: var(--accent); border-radius: 12px; padding: 20px 18px; border-top: none; margin-top: 8px; }
  .pitch-section .pitch-title { font-size: 19px; }

  /* State autocomplete combobox */
  .combo { position: relative; }
  .combo-list {
    list-style: none; margin: 6px 0 0; padding: 4px;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
    box-shadow: var(--shadow); max-height: 240px; overflow-y: auto;
    position: absolute; left: 0; right: 0; z-index: 20;
  }
  .combo-opt {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 10px; border-radius: 7px; cursor: pointer; font-size: 15px;
  }
  .combo-opt:hover, .combo-opt.active { background: var(--accent); }
  .combo-code { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: #fff;
  }
  .opt:hover { border-color: #cbb9a6; background: #fffdf9; }
  .opt input { margin-top: 3px; accent-color: var(--brand); width: 17px; height: 17px; flex: 0 0 auto; }
  .opt.checked { border-color: var(--brand); background: #fdf3f1; }
  .opt .txt { font-size: 15px; }

  .other-input, .text-input, select, input[type="email"] {
    width: 100%;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    margin-top: 8px;
    background: #fff;
  }
  .other-input { margin-top: 6px; margin-left: 29px; width: calc(100% - 29px); }
  select:focus, input:focus, textarea:focus, .other-input:focus {
    outline: none; border-color: var(--brand);
  }
  textarea.text-input { min-height: 96px; resize: vertical; }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 650;
    border-radius: 10px;
    padding: 12px 22px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: background .15s, opacity .15s;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn-ghost:hover { color: var(--ink); border-color: #cbb9a6; }

  .center-msg { text-align: center; }
  .center-msg .emoji { font-size: 40px; }
  .center-msg h2 { margin: 12px 0 8px; }
  .center-msg p { color: var(--muted); }

  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--line);
    border-top-color: var(--brand);
    border-radius: 50%;
    margin: 8px auto 14px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted); }

  @media (max-width: 480px) {
    .card { padding: 22px 16px; }
    .qtext { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Hiệu sách manga &amp; văn học tiếng Việt</div>
    <h1>Khảo sát độc giả</h1>
  </header>

  <div class="progress" id="progressBar" hidden><span></span></div>

  <main id="stage" class="card"></main>

  <footer id="footer"></footer>
</div>

<script>
"use strict";

// the Apps Script (see the setup notes). Leave "" to disable syncing.
const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbwIvLoB6f0r0-uRn8-NlTDL5stz-mH8rpAXevQbRHuAgzOh8XyNfRNT6HthsN4dwDms/exec";

// One id per visit, so every incremental save updates the SAME spreadsheet row.
const responseId = (crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : "r" + Date.now() + Math.random().toString(36).slice(2);

const US_STATES = [
  ["Alabama","AL"],["Alaska","AK"],["Arizona","AZ"],["Arkansas","AR"],
  ["California","CA"],["Colorado","CO"],["Connecticut","CT"],["Delaware","DE"],
  ["District of Columbia","DC"],["Florida","FL"],["Georgia","GA"],["Hawaii","HI"],
  ["Idaho","ID"],["Illinois","IL"],["Indiana","IN"],["Iowa","IA"],["Kansas","KS"],
  ["Kentucky","KY"],["Louisiana","LA"],["Maine","ME"],["Maryland","MD"],
  ["Massachusetts","MA"],["Michigan","MI"],["Minnesota","MN"],["Mississippi","MS"],
  ["Missouri","MO"],["Montana","MT"],["Nebraska","NE"],["Nevada","NV"],
  ["New Hampshire","NH"],["New Jersey","NJ"],["New Mexico","NM"],["New York","NY"],
  ["North Carolina","NC"],["North Dakota","ND"],["Ohio","OH"],["Oklahoma","OK"],
  ["Oregon","OR"],["Pennsylvania","PA"],["Rhode Island","RI"],["South Carolina","SC"],
  ["South Dakota","SD"],["Tennessee","TN"],["Texas","TX"],["Utah","UT"],
  ["Vermont","VT"],["Virginia","VA"],["Washington","WA"],["West Virginia","WV"],
  ["Wisconsin","WI"],["Wyoming","WY"]
].map(([name, code]) => ({ name, code }));

// Resolve free-typed input to a state name: exact name match or 2-letter code.
function resolveState(query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return null;
  const byCode = US_STATES.find(s => s.code.toLowerCase() === q);
  if (byCode) return byCode.name;
  const byName = US_STATES.find(s => s.name.toLowerCase() === q);
  return byName ? byName.name : null;
}

// States matching a partial query, for the autocomplete dropdown.
function filterStates(query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return US_STATES.slice();
  const starts = [], contains = [];
  for (const s of US_STATES) {
    const name = s.name.toLowerCase(), code = s.code.toLowerCase();
    if (code === q || name.startsWith(q)) starts.push(s);
    else if (name.includes(q)) contains.push(s);
  }
  return starts.concat(contains);
}

// Survey answers collected here.
const answers = {};

// ---- Question definitions -------------------------------------------------
// type: intro | single | state | text | email | thanks
// terminate: option values that end the survey
// path: single-choice options may set a branch path

const INTRO = {
  id: "intro",
  type: "intro"
};

  S1: {

    id: "S2", tag: "S2", type: "single",

      { v: "learner", label: "Tôi không có gốc Việt, nhưng tôi đang học hoặc muốn học tiếng Việt" },
      { v: "heritage_uninterested", label: "Tôi có gốc Việt nhưng không quan tâm đến tiếng Việt", terminate: true },
      { v: "none", label: "Tôi không có mối liên hệ nào với tiếng Việt và cũng không quan tâm", terminate: true }
    ]
  },

  S3: {
    id: "S3", tag: "S3", type: "single",
    q: "Trong 12 tháng qua, bạn đọc manga (bằng bất kỳ ngôn ngữ) thường xuyên như thế nào?",
    options: [
      { v: "several_week", label: "Vài lần một tuần trở lên" },

    id: "S4", tag: "S4", type: "single",
    q: "Bạn có đọc manga bằng tiếng Việt không?",
    options: [
      { v: "yes", label: "Có, tôi có đọc manga bằng tiếng Việt", path: "A" },

      { v: "no", label: "Không, và tôi không quan tâm đến manga tiếng Việt", terminate: true }
    ]
  },

  // ---- PATH A ----
  A1: {
    id: "A1", tag: "A1", type: "single",

      { v: "u25", label: "Dưới $25" },
      { v: "25_100", label: "$25–100" },
      { v: "100_300", label: "$100–300" },
      { v: "300plus", label: "$300 trở lên" },
      { v: "na", label: "Không muốn trả lời" }
    ]
  },
  A2: {
    id: "A2", tag: "A2", type: "single",
    q: "Cuốn gần đây nhất bạn đọc, bạn có được bằng cách nào?",
    options: [
      { v: "print_viet_store", label: "Mua bản in — hiệu sách Việt ở Mỹ" },
      { v: "print_regular_store", label: "Mua bản in — hiệu sách thông thường ở Mỹ (trực tuyến hoặc trực tiếp)" },
      { v: "print_intl_ship", label: "Mua bản in — đặt từ Việt Nam và ship quốc tế" },

      { v: "digital", label: "Mua bản điện tử — từ ứng dụng hoặc cửa hàng trực tuyến" },
      { v: "free_official", label: "Đọc miễn phí — nguồn chính thức/hợp pháp (kể cả thư viện)" },
      { v: "free_fan", label: "Đọc miễn phí — trang hoặc ứng dụng dịch của fan (không chính thức)" },
      { v: "borrow", label: "Mượn từ bạn bè hoặc người thân" },
      { v: "other", label: "Khác (vui lòng ghi rõ):", other: true }
    ]
  },
  A3: {
    id: "A3", tag: "A3", type: "single",
    q: "Điều gì cản trở bạn nhiều nhất trong việc đọc manga tiếng Việt?",
    hint: "Chọn một",
    options: [
      { v: "not_enough_titles", label: "Không có đủ tựa truyện" },
      { v: "hard_to_find", label: "Khó tìm / không biết mua ở đâu" },
      { v: "expensive", label: "Quá đắt hoặc phí ship quá cao" },
      { v: "prefer_other_lang", label: "Tôi thích đọc bằng ngôn ngữ khác hơn" },
      { v: "no_barriers", label: "Tôi đọc thoải mái theo ý muốn — không có gì cản trở" },
      { v: "other", label: "Khác (vui lòng ghi rõ):", other: true }
    ]
  },

  // ---- PATH B ----
  B1: {
    id: "B1", tag: "B1", type: "single",
    q: "Điều gì chủ yếu khiến bạn chưa đọc manga bằng tiếng Việt?",
    hint: "Chọn một",
    options: [
      { v: "dont_know_where", label: "Không biết tìm ở đâu" },
      { v: "titles_unavailable", label: "Những tựa truyện tôi muốn chưa có bản tiếng Việt" },

      { v: "reading_ability", label: "Khả năng đọc tiếng Việt của tôi chưa đủ tốt" },
      { v: "no_chance", label: "Chỉ là chưa có dịp" },
      { v: "other", label: "Khác:", other: true }
    ]
  },
  B2: {
    id: "B2", tag: "B2", type: "single",
    q: "Trong 12 tháng qua, bạn đã chi khoảng bao nhiêu tiền để mua manga (bằng bất kỳ ngôn ngữ nào)?",
    options: [
      { v: "0", label: "$0" },
      { v: "u25", label: "Dưới $25" },
      { v: "25_100", label: "$25–100" },
      { v: "100_300", label: "$100–300" },
      { v: "300plus", label: "$300 trở lên" },

    ]
  },
  B3: {

    options: [
      { v: "print_regular_store", label: "Mua bản in — hiệu sách thông thường (trực tuyến hoặc trực tiếp)" },
      { v: "digital", label: "Mua bản điện tử — từ ứng dụng hoặc cửa hàng trực tuyến" },
      { v: "free_official", label: "Đọc miễn phí — nguồn chính thức/hợp pháp (kể cả thư viện)" },
      { v: "free_fan", label: "Đọc miễn phí — trang hoặc ứng dụng dịch của người hâm mộ (không chính thức)" },

  // ---- Contact ----
  C1: {

    emailHint: "Chúng tôi chỉ email cho bạn về việc ra mắt và ưu đãi giảm giá của bạn thôi!"
  },
  C2: {
    id: "C2", tag: "C2", type: "text",
    q: "Bạn muốn chúng tôi có sẵn hoặc cung cấp điều gì nhất?",
    hint: "Không bắt buộc — nhưng chúng tôi rất muốn nghe ý kiến của bạn.",
    optional: true
  }
};

// Ordered flow used for progress + navigation history.
function nextId(currentId) {
  switch (currentId) {
    case "intro": return "S1";
    case "S1":    return "S1b";
    case "S1b":   return "S2";
    case "S2":    return "S3";
    case "S3":    return "S4";
    // Screeners done → everything else lives on one page.
    case "S4":    return "form";
    case "form":  return "__done";
    default:      return "__done";
  }
}

// Progress across the screeners, then the single combined form page.
const PROGRESS_STEPS = ["S1", "S1b", "S2", "S3", "S4", "form"];
function progressFor(id) {
  const idx = PROGRESS_STEPS.indexOf(id);
  if (idx < 0) return 0;
  return Math.round(((idx + 1) / PROGRESS_STEPS.length) * 100);
}

const history = [];
let currentId = "intro";

const stage = document.getElementById("stage");
const progressWrap = document.getElementById("progressBar");
const progressBar = progressWrap.querySelector("span");
const footer = document.getElementById("footer");

function setProgress(id) {
  if (id === "intro") { progressWrap.hidden = true; return; }
  progressWrap.hidden = false;
  progressBar.style.width = progressFor(id) + "%";
}

// ---- Renderers ------------------------------------------------------------

function render(id) {
  currentId = id;
  setProgress(id);
  window.scrollTo({ top: 0, behavior: "smooth" });

  if (id === "intro") return renderIntro();
  if (id === "form") return renderForm();

  const q = QUESTIONS[id];
  if (q.type === "single") return renderSingle(q);
  if (q.type === "state") return renderState(q);
}

function renderIntro() {
  stage.innerHTML = `
    <div class="intro">
      <p class="lead"><strong>Xin chào!</strong></p>
      <p>Chúng tôi là những người sắp mở hiệu sách ở Mỹ chuyên về manga và văn học tiếng Việt.
         Mong bạn giúp chúng tôi hiểu rõ hơn nhu cầu của độc giả đọc tiếng Việt.</p>
      <p>Để cảm ơn, bạn sẽ nhận được ưu đãi giảm giá dành cho khách hàng sớm khi chúng tôi ra mắt trang web.</p>
      <p style="font-size:13px;">Khảo sát chỉ mất khoảng 2 phút.</p>
    </div>
    <div class="nav">
      <span></span>
      <button class="btn-primary" id="startBtn">Bắt đầu</button>
    </div>`;
  document.getElementById("startBtn").onclick = () => go(nextId("intro"));
  footer.textContent = "";
}

function renderSingle(q) {
  const saved = answers[q.id];
  const savedOther = answers[q.id + "_other"] || "";
  stage.innerHTML = `
    <span class="qtag">${q.tag}</span>
    <p class="qtext">${q.q}</p>
    ${q.hint ? `<p class="qhint">${q.hint}</p>` : ""}
    <div class="options">
      ${q.options.map((o, i) => `
        <label class="opt" data-v="${o.v}">
          <input type="radio" name="opt" value="${o.v}" ${saved === o.v ? "checked" : ""} />
          <span class="txt">${o.label}</span>
        </label>
        ${o.other ? `<input class="other-input" type="text" id="otherInput"
            placeholder="Vui lòng ghi rõ…" value="${escapeAttr(savedOther)}"
            ${saved === o.v ? "" : "hidden"} />` : ""}
      `).join("")}
    </div>
    ${navHtml(true)}`;
  wireBack();

  const nextBtn = document.getElementById("nextBtn");
  const otherInput = document.getElementById("otherInput");

  function refresh() {
    const sel = stage.querySelector('input[name="opt"]:checked');
    stage.querySelectorAll(".opt").forEach(l => l.classList.toggle("checked", l.dataset.v === (sel && sel.value)));
    const selOpt = sel ? q.options.find(o => o.v === sel.value) : null;
    if (otherInput) {
      const showOther = selOpt && selOpt.other;
      otherInput.hidden = !showOther;
      if (showOther) otherInput.focus({ preventScroll: true });
    }
    const needsOther = selOpt && selOpt.other;
    nextBtn.disabled = !sel || (needsOther && !otherInput.value.trim());
  }

  stage.querySelectorAll('input[name="opt"]').forEach(r => r.addEventListener("change", refresh));
  if (otherInput) otherInput.addEventListener("input", refresh);
  refresh();

  nextBtn.onclick = () => {
    const sel = stage.querySelector('input[name="opt"]:checked');
    if (!sel) return;
    const opt = q.options.find(o => o.v === sel.value);
    answers[q.id] = sel.value;
    answers[q.id + "_label"] = opt.label;
    if (opt.other) answers[q.id + "_other"] = otherInput.value.trim();
    else delete answers[q.id + "_other"];

    if (opt.terminate) return terminate();
    go(nextId(q.id));
  };
}

// Screener S1b — a typed combobox that enforces one of the 50 states.
// Accepts full names and 2-letter codes (CA → California); free text that
// doesn't resolve to a state is rejected.
function renderState(q) {
  const saved = answers[q.id] || "";
  stage.innerHTML = `
    <span class="qtag">${q.tag}</span>
    <p class="qtext">${q.q}</p>
    <p class="qhint">Gõ tên tiểu bang hoặc mã 2 chữ cái (ví dụ: CA), rồi chọn từ danh sách.</p>
    <div class="combo">
      <input type="text" id="stateInput" class="text-input" autocomplete="off"
             placeholder="Nhập tiểu bang…" value="${escapeAttr(saved)}" />
      <ul class="combo-list" id="stateList" hidden></ul>
    </div>
    <p class="qhint" id="stateErr" style="color:var(--brand);" hidden>Vui lòng chọn một tiểu bang trong danh sách.</p>
    ${navHtml(true)}`;
  wireBack();

  const input = document.getElementById("stateInput");
  const list = document.getElementById("stateList");
  const err = document.getElementById("stateErr");
  const nextBtn = document.getElementById("nextBtn");
  let selected = resolveState(saved);
  let activeIdx = -1;

  const setSelected = (name) => { selected = name; nextBtn.disabled = !selected; };
  setSelected(selected);

  function renderList() {
    const typed = input.value.trim().toLowerCase();
    const matches = filterStates(input.value);
    activeIdx = -1;
    // Hide once the field already holds an exact, resolved state.
    if (!matches.length || (selected && selected.toLowerCase() === typed)) {
      list.hidden = true; list.innerHTML = ""; return;
    }
    list.innerHTML = matches.map((s, i) =>
      `<li class="combo-opt" data-name="${escapeAttr(s.name)}" data-i="${i}">
         <span>${s.name}</span><span class="combo-code">${s.code}</span>
       </li>`).join("");
    list.hidden = false;
  }

  function choose(name) {
    input.value = name;
    setSelected(name);
    err.hidden = true;
    list.hidden = true; list.innerHTML = "";
  }

  function highlight(opts) {
    opts.forEach((o, i) => o.classList.toggle("active", i === activeIdx));
    if (activeIdx >= 0) opts[activeIdx].scrollIntoView({ block: "nearest" });
  }

  input.addEventListener("input", () => {
    err.hidden = true;
    setSelected(resolveState(input.value)); // exact name/code counts as valid
    renderList();
  });
  input.addEventListener("focus", renderList);
  input.addEventListener("keydown", (e) => {
    const opts = Array.from(list.querySelectorAll(".combo-opt"));
    if (e.key === "ArrowDown" && opts.length) {
      e.preventDefault(); activeIdx = Math.min(activeIdx + 1, opts.length - 1); highlight(opts);
    } else if (e.key === "ArrowUp" && opts.length) {
      e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); highlight(opts);
    } else if (e.key === "Enter" && !list.hidden && opts.length) {
      e.preventDefault(); choose(opts[activeIdx >= 0 ? activeIdx : 0].dataset.name);
    } else if (e.key === "Escape") {
      list.hidden = true;
    }
  });
  // mousedown (not click) so it fires before the input's blur.
  list.addEventListener("mousedown", (e) => {
    const li = e.target.closest(".combo-opt");
    if (li) { e.preventDefault(); choose(li.dataset.name); }
  });
  input.addEventListener("blur", () => {
    setTimeout(() => {
      list.hidden = true;
      const r = resolveState(input.value);
      if (r) { input.value = r; setSelected(r); }
      else if (input.value.trim()) { setSelected(null); err.hidden = false; }
    }, 120);
  });

  nextBtn.onclick = () => {
    const r = resolveState(input.value);
    if (!r) { setSelected(null); err.hidden = false; return; }
    answers[q.id] = r;
    go(nextId(q.id));
  };
}

// ---- Combined page (everything after the screeners) -----------------------

function renderForm() {
  const path = answers.S4 === "want" ? "B" : "A";
  const qs = path === "B"
    ? [QUESTIONS.B1, QUESTIONS.B2, QUESTIONS.B3]
    : [QUESTIONS.A1, QUESTIONS.A2, QUESTIONS.A3];

  stage.innerHTML = `
    <p class="form-lead">Gần xong rồi! Vui lòng trả lời vài câu hỏi cuối.</p>
    ${qs.map(sectionHtml).join("")}
    <div class="form-section pitch-section">
      <p class="pitch-title">${QUESTIONS.C1.q}</p>
      <p class="pitch-body">${QUESTIONS.C1.body}</p>
      <label class="pitch-label" for="emailInput">Email của bạn (không bắt buộc)</label>
      <input type="email" id="emailInput" class="text-input" placeholder="ban@example.com"
             autocomplete="email" value="${escapeAttr(answers.email || "")}" />
      <p class="qhint">${QUESTIONS.C1.emailHint}</p>
      <p class="qhint" id="emailErr" style="color:var(--brand);" hidden>Vui lòng nhập email hợp lệ, hoặc để trống.</p>
    </div>
    <div class="form-section">
      <p class="qtext">${QUESTIONS.C2.q}</p>
      ${QUESTIONS.C2.hint ? `<p class="qhint">${QUESTIONS.C2.hint}</p>` : ""}
      <textarea class="text-input" id="wishInput" placeholder="Ý kiến của bạn…">${escapeHtml(answers.C2 || "")}</textarea>
    </div>
    <div class="nav">
      <button class="btn-ghost" id="backBtn">← Quay lại</button>
      <button class="btn-primary" id="submitBtn">Gửi khảo sát</button>
    </div>
    <p class="qhint" id="formErr" style="color:var(--brand); text-align:right;" hidden>Vui lòng trả lời tất cả câu hỏi ở trên.</p>`;
  wireBack();

  const submitBtn = document.getElementById("submitBtn");
  const emailInput = document.getElementById("emailInput");
  const emailErr = document.getElementById("emailErr");
  const wishInput = document.getElementById("wishInput");
  const formErr = document.getElementById("formErr");
  const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());

  function allAnswered() {
    return qs.every(q => {
      const v = answers[q.id];
      if (v === undefined) return false;
      const opt = q.options.find(o => o.v === v);
      if (opt && opt.other && !(answers[q.id + "_other"] || "").trim()) return false;
      return true;
    });
  }
  function updateState() {
    submitBtn.disabled = !allAnswered();
    if (!submitBtn.disabled) formErr.hidden = true;
  }
  function readContact() {
    answers.email = emailInput.value.trim();
    answers.C2 = wishInput.value.trim();
  }

  qs.forEach(q => wireSection(q, updateState));
  updateState();

  emailInput.addEventListener("input", () => { emailErr.hidden = true; });
  emailInput.addEventListener("blur", () => { readContact(); syncProgress("in_progress"); });
  wishInput.addEventListener("blur", () => { readContact(); syncProgress("in_progress"); });

  submitBtn.onclick = () => {
    if (!allAnswered()) { formErr.hidden = false; return; }
    const em = emailInput.value.trim();
    if (em && !validEmail(em)) { emailErr.hidden = false; emailInput.focus(); return; }
    readContact();
    finish();
  };
}

// One single-choice question as a section within the combined form.
function sectionHtml(q) {
  return `
    <div class="form-section" data-qid="${q.id}">
      <p class="qtext">${q.q}</p>
      ${q.hint ? `<p class="qhint">${q.hint}</p>` : ""}
      <div class="options">
        ${q.options.map(o => `
          <label class="opt" data-v="${o.v}">
            <input type="radio" name="opt_${q.id}" value="${o.v}" ${answers[q.id] === o.v ? "checked" : ""} />
            <span class="txt">${o.label}</span>
          </label>
          ${o.other ? `<input class="other-input" type="text" data-other="${q.id}"
              placeholder="Vui lòng ghi rõ…" value="${escapeAttr(answers[q.id + "_other"] || "")}"
              ${answers[q.id] === o.v ? "" : "hidden"} />` : ""}
        `).join("")}
      </div>
    </div>`;
}

function wireSection(q, onChange) {
  const section = stage.querySelector(`.form-section[data-qid="${q.id}"]`);
  const radios = section.querySelectorAll('input[type="radio"]');
  const otherInput = section.querySelector("input[data-other]");

  function refresh(sync) {
    const sel = section.querySelector('input[type="radio"]:checked');
    section.querySelectorAll(".opt").forEach(l =>
      l.classList.toggle("checked", !!sel && l.dataset.v === sel.value));
    if (sel) {
      const opt = q.options.find(o => o.v === sel.value);
      answers[q.id] = sel.value;
      answers[q.id + "_label"] = opt.label;
      if (otherInput) {
        otherInput.hidden = !opt.other;
        if (opt.other) { answers[q.id + "_other"] = otherInput.value.trim(); if (sync) otherInput.focus(); }
        else delete answers[q.id + "_other"];
      }
    }
    onChange();
    if (sync) syncProgress("in_progress");
  }

  radios.forEach(r => r.addEventListener("change", () => refresh(true)));
  if (otherInput) {
    otherInput.addEventListener("input", () => { answers[q.id + "_other"] = otherInput.value.trim(); onChange(); });
    otherInput.addEventListener("blur", () => syncProgress("in_progress"));
  }
  if (answers[q.id] !== undefined) refresh(false); // restore label/checked state
}

// ---- Navigation helpers ---------------------------------------------------

function navHtml(showBack, nextLabel) {
  return `
    <div class="nav">
      ${showBack ? `<button class="btn-ghost" id="backBtn">← Quay lại</button>` : `<span></span>`}
      <button class="btn-primary" id="nextBtn">${nextLabel || "Tiếp tục"}</button>
    </div>`;
}

function wireBack() {
  const b = document.getElementById("backBtn");
  if (b) b.onclick = back;
}

function go(id) {
  if (id === "__done") return finish();
  syncProgress("in_progress");   // save whatever has been answered so far
  history.push(currentId);
  render(id);
}

function back() {
  if (!history.length) return;
  const prev = history.pop();
  render(prev);
}

function terminate() {
  setProgress("__end");
  progressWrap.hidden = true;
  stage.innerHTML = `
    <div class="center-msg">
      <div class="emoji">🙏</div>
      <h2>Cảm ơn bạn đã dành thời gian!</h2>
      <p>Dựa trên câu trả lời của bạn, khảo sát này không phù hợp lắm — nhưng chúng tôi thật sự
         trân trọng sự quan tâm của bạn. Chúc bạn một ngày tốt lành!</p>
    </div>`;
  footer.textContent = "";
  syncProgress("terminated");
}

function finish() {
  syncProgress("completed");
  progressBar.style.width = "100%";
  stage.innerHTML = `
    <div class="center-msg">
      <div class="emoji">🎉</div>
      <h2>Cảm ơn bạn rất nhiều!</h2>
      <p>Câu trả lời của bạn đã được ghi nhận. Nếu bạn để lại email, chúng tôi sẽ liên hệ
         khi cửa hàng ra mắt — kèm ưu đãi giảm giá dành cho khách hàng sớm.</p>
    </div>`;
  footer.textContent = "";
}

// Build a flat, human-readable row from the current answers.
function buildRow(status) {
  return {
    id: responseId,
    status: status,
    updated_at: new Date().toISOString(),
    us_resident: answers.S1_label || "",
    state: answers.S1b || "",
    vi_relationship: answers.S2_label || "",
    manga_frequency: answers.S3_label || "",
    reads_vi_manga: answers.S4_label || "",
    path: answers.A1 !== undefined ? "A — reads VI manga"
        : answers.B1 !== undefined ? "B — interested"
        : "",
    manga_spend: answers.A1_label || answers.B2_label || "",
    acquisition: withOther(answers.A2_label || answers.B3_label, answers.A2_other || answers.B3_other),
    barrier: withOther(answers.A3_label || answers.B1_label, answers.A3_other || answers.B1_other),
    email: answers.email || "",
    wishlist: answers.C2 || "",
  };
}

function withOther(label, other) {
  if (!label) return "";
  return other ? (label + " " + other) : label;
}

// Save progress to the spreadsheet after each step. Fire-and-forget: `no-cors`
// + text/plain avoids a CORS preflight (Apps Script can't send CORS headers),
// and `keepalive` lets the last save finish as the page redirects away.
let finalized = false; // set once completed/terminated, to lock the final status

function syncProgress(status) {
  // Nothing answered yet (still on intro) — skip creating an empty row.
  if (status === "in_progress" && answers.S1 === undefined) return;
  // Once the response is finalized, ignore late "in_progress" saves (e.g. a
  // field blur fired while the page is being torn down) so they can't overwrite
  // the completed/terminated status in the sheet.
  if (finalized && status === "in_progress") return;
  if (status === "completed" || status === "terminated") finalized = true;

  const row = buildRow(status);

  // Local safety-net copy.
  try { localStorage.setItem("manga_survey_" + responseId, JSON.stringify(row)); }
  catch (e) { /* storage unavailable — ignore */ }

  if (!SHEET_ENDPOINT) return;
  try {
    fetch(SHEET_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(row),
      keepalive: true,
    }).catch(() => {});
  } catch (e) { /* fetch unavailable — ignore */ }
}

// ---- Utils ----------------------------------------------------------------
function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function escapeAttr(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ---- Boot -----------------------------------------------------------------
render("intro");
</script>
